---
- name: "[ docker] Prune unused containers older >24h"
  ansible.builtin.command:
    cmd: docker container prune -f --filter "until=24h"
  changed_when: false

- name: "[ docker] Prune unused images"
  ansible.builtin.command:
    cmd: docker image prune -f
  changed_when: false

- name: "[ docker] Prune unused networks"
  ansible.builtin.command:
    cmd: docker network prune -f
  changed_when: false

- name: "[ docker] Prune unused volumes"
  ansible.builtin.command:
    cmd: docker volume prune -f
  changed_when: false

- name: "[ docker] Prune builder cache"
  ansible.builtin.command:
    cmd: docker builder prune -f
  changed_when: false
