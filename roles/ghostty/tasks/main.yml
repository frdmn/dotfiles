---
- name: "[󰊠 ghostty] Create config directory"
  ansible.builtin.file:
    path: ~/.config/ghostty
    state: directory
    mode: "0755"

- name: "[󰊠 ghostty] Set config symlink"
  ansible.builtin.file:
    src: "{{ playbook_dir }}/files/ghostty/config"
    path: ~/.config/ghostty/config
    state: link
